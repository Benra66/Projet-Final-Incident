name: CI and security release gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy production after every gate passes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: incident-desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py test --settings=config.settings.test

  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      db:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_DB: incidentdesk
          POSTGRES_USER: incidentdesk
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentdesk -d incidentdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://incidentdesk:ci-only-password@127.0.0.1:5432/incidentdesk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput --settings=config.settings.ci
      - run: python manage.py test --settings=config.settings.ci

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-security.txt
      - run: bandit -q -r config incidents -x incidents/tests -ll

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  authenticated-dast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dast
      DAST_USERNAME: zap-reporter
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Create temporary scan credential
        shell: bash
        run: echo "DAST_REPORTER_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
      - run: python manage.py migrate --noinput
      - run: python manage.py setup_dast
      - name: Start disposable local application
        shell: bash
        run: |
          python manage.py runserver 0.0.0.0:8000 > /tmp/incident-desk-dast.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:8000/accounts/login/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/incident-desk-dast.log
          exit 1
      - name: Run scoped authenticated ZAP scan
        shell: bash
        run: |
          mkdir -p zap-reports
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            --env DAST_USERNAME \
            --env DAST_REPORTER_PASSWORD \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -addoninstall authhelper -addonupdate -cmd -autorun /zap/wrk/.github/zap-dast.yaml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: zap-authenticated-dast-report
          path: zap-reports/
          if-no-files-found: ignore
          retention-days: 14

  production-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: [sqlite-tests, postgres-tests, sast, dependency-audit, secret-scan, authenticated-dast]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the Vercel production deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "Set VERCEL_DEPLOY_HOOK in GitHub Actions secrets."; exit 1; }
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
